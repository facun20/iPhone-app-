workflows:
  earnit-ios:
    name: EarnIt iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      vars:
        XCODE_PROJECT: "FocusSnap.xcodeproj"
        XCODE_SCHEME: "FocusSnap"
        BUNDLE_ID: "com.infinit3dev.focussnap"
    scripts:
      - name: Set up code signing
        script: |
          # If you've set up code signing in Codemagic dashboard,
          # uncomment these lines:
          # keychain initialize
          # app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE
          # app-store-connect fetch-signing-files "$BUNDLE_ID.DeviceActivityMonitor" --type IOS_APP_STORE
          # app-store-connect fetch-signing-files "$BUNDLE_ID.ShieldConfiguration" --type IOS_APP_STORE
          # app-store-connect fetch-signing-files "$BUNDLE_ID.ShieldAction" --type IOS_APP_STORE
          # keychain add-certificates
          # xcode-project use-profiles
          echo "Code signing will be configured after Apple Developer setup"

      - name: Build iOS app for App Preview (simulator)
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO | xcpretty

      - name: Collect simulator app
        script: |
          APP_PATH=$(find $HOME/Library/Developer/Xcode/DerivedData -name "FocusSnap.app" -path "*/Debug-iphonesimulator/*" | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p build/ios/simulator
          cp -R "$APP_PATH" build/ios/simulator/

    artifacts:
      - build/ios/simulator/*.app
      - /tmp/xcodebuild_logs/*.log

    # Uncomment after setting up App Store Connect API key in Codemagic:
    # publishing:
    #   app_store_connect:
    #     auth: integration
    #     submit_to_testflight: true
